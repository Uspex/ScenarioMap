        var list = [];
        d.branches.forEach(function (b) { list.push({ to: b.to, tone: b.tone, paused: b.paused }); });
        d.next.forEach(function (n) { list.push({ to: n.to, tone: 'ok' }); });
        return list;
      };
      /* Путь от входа до выбранного шага — как сюда пришли; дальнейшие шаги не подсвечиваются.
         Если шаг лежит на дорожке пресета — берём её префикс (осмысленный маршрут сценария),
         иначе — кратчайший путь от входа по рёбрам. */
      function chainFor(id) {
        for (var i = 0; i < CHAINS.length; i += 1) {
          var c = CHAINS[i];
          var k = c.path.indexOf(id);
          if (k !== -1) return { name: c.name, tracks: [c.path.slice(0, k + 1)] };
        }
        var prev = {}, seen = {}; seen[ROOT] = true; var q = [ROOT], found = false;
        while (q.length) {
          var u = q.shift(); if (u === id) { found = true; break; }
          outsOf(u).forEach(function (e) { if (!seen[e.to]) { seen[e.to] = true; prev[e.to] = u; q.push(e.to); } });
        }
        var path = [id];
        if (found) { var c2 = id; while (prev[c2] !== undefined) { c2 = prev[c2]; path.unshift(c2); } }
        return { name: null, tracks: [path] };
      }
      var badge = document.createElement('div'); badge.className = 'scenario-chain'; badge.hidden = true; container.appendChild(badge);
      function clearChain() {
        svg.removeAttribute('data-scenario-path');
        Array.prototype.forEach.call(svg.querySelectorAll('[data-path-match]'), function (el) { el.removeAttribute('data-path-match'); el.style.removeProperty('--i'); el.style.removeProperty('--n'); });
        Array.prototype.forEach.call(svg.querySelectorAll('[data-path-selected]'), function (el) { el.removeAttribute('data-path-selected'); });
        Array.prototype.forEach.call(svg.querySelectorAll('.scenario-flow'), function (el) { el.remove(); });
        badge.hidden = true;
      }
      function showChain(id) {
        clearChain();
        var chain = chainFor(id);
        var nodes = [], edges = 0;
        chain.tracks.forEach(function (track) {
          track.forEach(function (n, i) {
            var el = svg.querySelector('[data-node-id="' + n + '"]');
            if (el) { el.setAttribute('data-path-match', ''); el.style.setProperty('--i', String(nodes.length)); nodes.push(n); }
            if (i === 0) return;
            var sel = '[data-edge-from="' + track[i - 1] + '"][data-edge-to="' + n + '"]';
            Array.prototype.forEach.call(svg.querySelectorAll(sel), function (e) {
              e.setAttribute('data-path-match', '');
              if (e.tagName.toLowerCase() === 'path') {
                var clone = e.cloneNode(false);
                Array.prototype.slice.call(clone.attributes).forEach(function (a) { if (a.name !== 'd') clone.removeAttribute(a.name); });
                clone.setAttribute('class', 'scenario-flow' + (/a-security/.test(e.getAttribute('class') || '') ? ' bad' : /a-dashed/.test(e.getAttribute('class') || '') ? ' dash' : ''));
                svg.appendChild(clone); edges += 1;
              }
            });
          });
        });
        Array.prototype.forEach.call(svg.querySelectorAll('[data-path-match][data-node-id]'), function (el) { el.style.setProperty('--n', String(Math.max(nodes.length, 3))); });
        var selected = svg.querySelector('[data-node-id="' + id + '"]');
        if (selected) selected.setAttribute('data-path-selected', '');
        svg.setAttribute('data-scenario-path', '1');
        badge.setAttribute('data-step', id);
      }
      badge.addEventListener('click', function (e) {
        var b = e.target.closest('[data-chain]'); if (!b) return;
        if (b.getAttribute('data-chain') === 'clear') clearChain();
        else if (window.Archify && Archify.focus) Archify.focus.set(badge.getAttribute('data-step'), { toggle: false });
      });
      /* ---- боковая панель: сценарий целиком или паспорт выбранного шага ---- */
      var KIND_NAME = { entry: 'вход', step: 'шаг', branch: 'ветвление', wait: 'ожидание', terminal: 'финиш' };
      var TONE_NAME = { ok: 'успех', bad: 'сбой', warn: 'предупреждение', info: 'справка' };
      var scenarioIdx = 0;
      var sideStep = null;

      function sideAll() {
        sideStep = null;
        var stageKeys = Object.keys(STAGES);
        var byStage = {};
        Object.keys(data).forEach(function (id) { var st = data[id].stage || '__none'; (byStage[st] = byStage[st] || []).push(id); });
        var h = '<div class="sd-kicker">все сценарии</div><h4>Дерево флоу целиком</h4>';
        h += '<p style="margin:.35rem 0 0">Видны все ветвления и исходы сразу. Чтобы пройти один путь, выберите сценарий в списке сверху — тогда на карте останутся только его блоки.</p>';
        h += '<dl class="sd-meta"><dt>Блоков</dt><dd>' + Object.keys(data).length + '</dd><dt>Сценариев</dt><dd>' + CHAINS.length + '</dd></dl>';
        stageKeys.concat(byStage.__none ? ['__none'] : []).forEach(function (key) {
          var ids = byStage[key] || [];
          if (!ids.length) return;
          h += '<div class="sd-kicker" style="margin-top:.7rem">' + esc(key === '__none' ? 'без этапа' : STAGES[key]) + ' · ' + ids.length + '</div>';
          h += '<ol class="sd-steps">' + ids.map(function (id) {
            return '<li><button type="button" data-step-id="' + esc(id) + '">' + esc(data[id].title || id) + '</button></li>';
          }).join('') + '</ol>';
        });
        side.innerHTML = h;
      }
      function sideScenario() {
        sideStep = null;
        if (scenarioIdx === -1) return sideAll();
        var c = CHAINS[scenarioIdx];
        if (!c) { side.innerHTML = '<div class="sd-kicker">сценарий</div><h4>Все шаги</h4>'; return; }
        var h = '<div class="sd-kicker">сценарий ' + (scenarioIdx + 1) + ' из ' + CHAINS.length + '</div>';
        h += '<h4>' + esc(c.name) + '</h4>';
        if (c.note) h += '<p style="margin:.35rem 0 0">' + esc(c.note) + '</p>';
        h += '<dl class="sd-meta"><dt>Шагов</dt><dd>' + c.path.length + '</dd>' +
          '<dt>Начало</dt><dd>' + esc((data[c.path[0]] && data[c.path[0]].title) || c.path[0]) + '</dd>' +
          '<dt>Финиш</dt><dd>' + esc((data[c.path[c.path.length - 1]] && data[c.path[c.path.length - 1]].title) || '') + '</dd></dl>';
        h += '<ol class="sd-steps">' + c.path.map(function (id) {
          var d = data[id] || {};
          return '<li><button type="button" data-step-id="' + esc(id) + '">' + esc(d.title || id) + '</button></li>';
        }).join('') + '</ol>';
        h += '<div class="sd-hint">Шаг в списке или карточка на схеме открывают его паспорт: что происходит, условия веток, файл в коде и замечания.</div>';
        side.innerHTML = h;
      }

      var ACTOR_NAME = JSON.parse(document.getElementById('scenario-actor-data').textContent);
      function sideStepView(id) {
        var d = data[id];
        if (!d) return sideScenario();
        sideStep = id;
        var h = '<button type="button" class="sd-back">← к сценарию</button>';
        h += '<div class="sd-kicker">' + esc(KIND_NAME[d.kind] || 'шаг') + (d.outcome ? ' · ' + esc(TONE_NAME[d.outcome] || d.outcome) : '') + '</div>';
        h += '<h4>' + esc(d.title || id) + '</h4>';
        h += '<dl class="sd-meta"><dt>Где</dt><dd>' + esc(ACTOR_NAME[d.actor] || d.actor || '—') + '</dd></dl>';
        if (d.code || d.file || d.anchor) {
          h += '<details class="sd-code"><summary>code</summary><div class="sd-code-body">' +
            (d.code ? '<div><span>метод</span>' + esc(d.code) + '</div>' : '') +
            (d.file ? '<div><span>файл</span>' + esc(d.file) + '</div>' : '') +
            (d.anchor ? '<div><span>anchor</span>' + esc(d.anchor) + '</div>' : '') +
            '</div></details>';
        }
        h += '<div class="scenario-step">' + stepHtml(d, { hideCode: true }) + '</div>';
        side.innerHTML = h;
        side.scrollTop = 0;
      }

      side.addEventListener('click', function (e) {
        var back = e.target.closest('.sd-back');
        if (back) { sideScenario(); markSideCurrent(); return; }
        var b = e.target.closest('[data-step-id]');
        if (b) {
          var id = b.getAttribute('data-step-id');
          sideStepView(id);
          goTo(id);
          if (svg.querySelector('[data-node-id="' + id + '"]')) { clearChain(); showChain(id); }
        }
      });

      function markSideCurrent() {
        Array.prototype.forEach.call(side.querySelectorAll('[data-step-id]'), function (b) {
          if (sideStep && b.getAttribute('data-step-id') === sideStep) b.setAttribute('data-cur', ''); else b.removeAttribute('data-cur');
        });
      }

      /* Подсветка всей дорожки сценария (селектор), а не пути до шага (клик по карточке) */
      function showTrack(track) {
        clearChain();
        var nodes = [];
        /* фоновые задачи блоков сценария — часть сценария: помечаем их и рёбра к ним */
        track.forEach(function (n) {
          ((data[n] && data[n].spawns) || []).forEach(function (sp) {
            var el = svg.querySelector('[data-node-id="' + sp.to + '"]');
            if (el) el.setAttribute('data-path-match', '');
            Array.prototype.forEach.call(svg.querySelectorAll('[data-edge-from="' + n + '"][data-edge-to="' + sp.to + '"]'), function (e) { e.setAttribute('data-path-match', ''); });
          });
        });
        track.forEach(function (n, i) {
          var el = svg.querySelector('[data-node-id="' + n + '"]');
          if (el) { el.setAttribute('data-path-match', ''); el.style.setProperty('--i', String(nodes.length)); nodes.push(n); }
          if (i === 0) return;
          Array.prototype.forEach.call(svg.querySelectorAll('[data-edge-from="' + track[i - 1] + '"][data-edge-to="' + n + '"]'), function (e) {
            e.setAttribute('data-path-match', '');
            if (e.tagName.toLowerCase() === 'path') {
              var clone = e.cloneNode(false);
              Array.prototype.slice.call(clone.attributes).forEach(function (a) { if (a.name !== 'd') clone.removeAttribute(a.name); });
              clone.setAttribute('class', 'scenario-flow' + (/a-security/.test(e.getAttribute('class') || '') ? ' bad' : /a-dashed/.test(e.getAttribute('class') || '') ? ' dash' : ''));
              svg.appendChild(clone);
            }
          });
        });
        Array.prototype.forEach.call(svg.querySelectorAll('[data-path-match][data-node-id]'), function (el) { el.style.setProperty('--n', String(Math.max(nodes.length, 3))); });
        svg.setAttribute('data-scenario-path', '1');
      }

      var pickEl = null;
      function selectScenario(i, moveCamera) {
        scenarioIdx = i;
        if (pickEl && String(pickEl.value) !== String(i)) pickEl.value = String(i);
        showGraph(i === -1 ? 'all' : i);
        clearChain();
        sideScenario();
        if (i !== -1 && moveCamera !== false) {
          var c = CHAINS[i];
          if (c && c.path && c.path.length) goTo(c.path[0]);
        }
      }

      var routeProbe = document.getElementById('route-probe');
      /* Слушаем контейнер, а не конкретный SVG: графов несколько и активный меняется. */
      container.addEventListener('click', function (e) {
        if (routeProbe && !routeProbe.hidden) return;                         /* режим маршрута Archify — не мешаем */
        if (container.getAttribute('data-just-panned') === 'true') return;
        var node = e.target.closest('[data-node-id]');
        if (node) {
          e.stopPropagation(); e.preventDefault();
          var id = node.getAttribute('data-node-id');
          /* повторный клик по выбранному блоку снимает подсветку и возвращает сценарий;
             иначе — путь до блока (остальное гаснет, по рёбрам бежит поток) и его паспорт */
          if (node.hasAttribute('data-path-selected')) { clearChain(); sideScenario(); return; }
          showChain(id);
          sideStepView(id);
          return;
        }
        clearChain();
        sideScenario();
      }, true);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { clearChain(); sideScenario(); } });

      /* ---- зум: кнопки в правом верхнем углу, ctrl/⌘+колесо к точке под курсором ----
         Стартовый масштаб задаёт сборщик (CONFIG.startZoom флоу): чем шире раскладка,
         тем мельче узлы при одном и том же зуме, поэтому у широких карт старт выше. */
      var startScale = /*__START_ZOOM__*/1.25;
      var startPct = Math.round(startScale * 100) + '%';
      var toolbar = document.querySelector('.toolbar');
      var view = window.Archify && Archify.view;
      if (toolbar && view) {
        var wrap = document.createElement('div'); wrap.className = 'scenario-zoom';
        wrap.innerHTML = '<button type="button" data-zoom="out" title="Уменьшить (−), до 30 %">−</button>' +
          '<button type="button" class="scenario-zoom-pct" data-zoom="reset" title="Вернуть ' + startPct + '">' + startPct + '</button>' +
          '<button type="button" data-zoom="in" title="Увеличить (+)">+</button>';
        toolbar.insertBefore(wrap, toolbar.firstChild);
        var pct = wrap.querySelector('.scenario-zoom-pct');
        /* Свой зум: камера Archify живёт только в первом графе, а у нас их несколько,
           поэтому масштаб задаём размерами активного SVG, а двигаемся прокруткой окна. */
        function setZoom(next, keepCenter) {
          next = Math.max(0.3, Math.min(4, Math.round(next * 20) / 20));
          if (next === ZOOM) return;
          var cx = (container.scrollLeft + container.clientWidth / 2) / Math.max(svg.clientWidth, 1);
          var cy = (container.scrollTop + container.clientHeight / 2) / Math.max(svg.clientHeight, 1);
          ZOOM = next;
          applyNatural();
          pct.textContent = Math.round(ZOOM * 100) + '%';
          if (keepCenter !== false) {
            container.scrollLeft = cx * svg.clientWidth - container.clientWidth / 2;
            container.scrollTop = cy * svg.clientHeight - container.clientHeight / 2;
          }
        }
        var startZoom = function () {
          /* вид на первый блок активного графа */
          var r0 = svg.querySelector('[data-node-id="' + ROOT + '"]') || svg.querySelector('[data-node-id]');
          if (!r0) return;
          var rb = r0.getBoundingClientRect(), cb = container.getBoundingClientRect();
          container.scrollLeft += rb.left - cb.left - (cb.width - rb.width) / 2;
          container.scrollTop = 0;
        };
        wrap.addEventListener('click', function (e) {
          var b = e.target.closest('[data-zoom]'); if (!b) return;
          var a = b.getAttribute('data-zoom');
          if (a === 'in') setZoom(ZOOM + 0.05); else if (a === 'out') setZoom(ZOOM - 0.05); else setZoom(startScale);
        });
        container.addEventListener('wheel', function (e) {
          if (!(e.ctrlKey || e.metaKey)) return;
          e.preventDefault();
          setZoom(ZOOM * (e.deltaY < 0 ? 1.05 : 1 / 1.05));
        }, { passive: false });
        /* Перетаскивание полотна за пустое место: двигаем прокрутку окна схемы. Панорамирование
           Archify тут не работает — оно двигает камеру и включается только при масштабе камеры
           больше 100 %, а у нас масштаб задаётся размером SVG и камера стоит на месте.
           Клик по блоку не трогаем; после сдвига ставим data-just-panned, чтобы отпускание мыши
           не считалось кликом по пустому месту (он снимает подсветку пути). */
        var pan = null;
        container.addEventListener('pointerdown', function (e) {
          if (!NATURAL || e.button !== 0) return;
          if (e.target.closest('[data-node-id], [data-relationship-hit-key], .diagram-nav, .focus-chip, .node-finder, .diagram-guide, .overview-map, .route-probe, .semantic-lens, a, button')) return;
          pan = { x: e.clientX, y: e.clientY, left: container.scrollLeft, top: container.scrollTop, moved: false };
          container.classList.add('is-panning');
          try { container.setPointerCapture(e.pointerId); } catch (_) {}
        }, true);
        container.addEventListener('pointermove', function (e) {
          if (!pan) return;
          var dx = e.clientX - pan.x, dy = e.clientY - pan.y;
          if (Math.abs(dx) + Math.abs(dy) > 3) pan.moved = true;
          container.scrollLeft = pan.left - dx;
          container.scrollTop = pan.top - dy;
        }, true);
        function panEnd(e) {
          if (!pan) return;
          var moved = pan.moved;
          pan = null;
          container.classList.remove('is-panning');
          try { container.releasePointerCapture(e.pointerId); } catch (_) {}
          if (moved) {
            container.setAttribute('data-just-panned', 'true');
            setTimeout(function () { container.removeAttribute('data-just-panned'); }, 80);
          }
        }
        container.addEventListener('pointerup', panEnd, true);
        container.addEventListener('pointercancel', panEnd, true);
        requestAnimationFrame(function () { requestAnimationFrame(startZoom); });

        /* Нижний блок сводки (входы, исходы, замечания) — во всплывающее окно по кнопке */
        var cards = document.querySelector('.container .cards');
        if (cards) {
          var modal = document.createElement('div'); modal.className = 'scenario-summary';
          var boxEl = document.createElement('div'); boxEl.className = 'scenario-summary__box';
          boxEl.innerHTML = '<div class="scenario-summary__head"><strong>Сводка по флоу</strong>' +
            '<button type="button" class="sd-back" data-summary="close">закрыть ✕</button></div>';
          boxEl.appendChild(cards);
          modal.appendChild(boxEl);
          document.body.appendChild(modal);
          var sumBtn = document.createElement('button');
          sumBtn.type = 'button'; sumBtn.textContent = 'Сводка'; sumBtn.title = 'Входы, исходы и замечания по флоу';
          toolbar.insertBefore(sumBtn, toolbar.firstChild);
          sumBtn.addEventListener('click', function () { modal.classList.add('open'); });
          modal.addEventListener('click', function (e) {
            if (e.target === modal || e.target.closest('[data-summary="close"]')) modal.classList.remove('open');
          });
          document.addEventListener('keydown', function (e) { if (e.key === 'Escape') modal.classList.remove('open'); });
        }

        /* Оформление, презентация и экспорт Archify тут не нужны */
        ['.preset-wrap', '#btn-present', '.export-wrap'].forEach(function (sel) {
          var el = document.querySelector(sel);
          if (el) el.style.display = 'none';
        });

        /* Сценарии: вместо верхней ленты Archify — селектор рядом с зумом */
        if (CHAINS.length) {
          var pickWrap = document.createElement('label');
          pickWrap.style.display = 'inline-flex';
          pickWrap.innerHTML = '<select class="scenario-pick" title="Сценарий"></select>';
          var pick = pickWrap.firstChild;
          pickEl = pick;
          pick.innerHTML = '<option value="-1">Все сценарии · дерево целиком</option>' +
            CHAINS.map(function (c, i) { return '<option value="' + i + '">' + esc((i + 1) + ' · ' + c.name) + '</option>'; }).join('');
          toolbar.insertBefore(pickWrap, toolbar.firstChild);
          pick.addEventListener('change', function () { selectScenario(Number(pick.value), true); });
          selectScenario(0, false);
          requestAnimationFrame(function () { requestAnimationFrame(function () { selectScenario(0, false); }); });
        } else {
          sideScenario();
        }
      }
    })();
    </script>
